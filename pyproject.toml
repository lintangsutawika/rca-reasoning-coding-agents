[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rca"]

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "rca"
version = "0.0.1"
authors = [
    {name="Lintang Sutawika", email="lsutawik@andrew.cmu.edu"}
]
description = "Expectation-Maximization for Agentic Coders"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
license = { "text" = "MIT" }
dependencies = [
    "skyrl-train @ git+https://github.com/NovaSky-AI/SkyRL.git#subdirectory=skyrl-train",
    "openhands-agent-server @ git+https://github.com/All-Hands-AI/agent-sdk.git@main#subdirectory=openhands/agent_server",
    "openhands-sdk @ git+https://github.com/All-Hands-AI/agent-sdk.git@main#subdirectory=openhands/sdk",
    "openhands-tools @ git+https://github.com/All-Hands-AI/agent-sdk.git@main#subdirectory=openhands/tools",
    "mini-swe-agent>=1.12.0",
    "swesmith>=0.0.7",
    "swebench>=4.1.0",
    "vllm",
    "bashlex>=0.18",
    "binaryornot>=0.4.4",
    "cachetools",
    "libtmux>=0.46.2",
    "pydantic>=2.11.7",
    "browser-use>=0.7.7",
    "func-timeout>=4.3.5",
    "logger>=1.4",
    "ipython",
]

[dependency-groups]
dev = [
    "ipython>=9.6.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.uv]
override-dependencies = [
    "flash-attn",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.extra-build-dependencies]
flash-attn = ["torch"]

[tool.setuptools.packages.find]
include = ["rca/*"]
